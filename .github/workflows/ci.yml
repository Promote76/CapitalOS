name: Capital OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capital-os-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify financial and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: capital_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d capital_os_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/capital_os_ci
      SESSION_SECRET: capital-os-ci-session-secret-000000000000000000000000
      CAPITAL_OS_PUBLIC_ORIGIN: https://capital-os.invalid
      SCHWAB_READ_ONLY_ENABLED: "false"
      SCHWAB_TRADING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable database
        run: pnpm --filter @workspace/db run push-force

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Verify generated finance artifacts
        run: pnpm run check:generated-finance-artifacts

      - name: Verify API route contract
        run: pnpm --filter @workspace/api-server run check-contract

      - name: Certify Portfolio AI and Schwab snapshot safety
        run: pnpm run certify:portfolio-ai

      - name: Run broker portfolio domain tests
        run: pnpm --filter @workspace/api-server run test:broker-portfolio

      - name: Run API test suite
        run: pnpm --filter @workspace/api-server run test

      - name: Run Capital OS UI unit tests
        run: |
          pnpm --filter @workspace/capital-os run test:bank-connections
          pnpm --filter @workspace/capital-os run test:dashboard-state
          pnpm --filter @workspace/capital-os run test:documents-queue
          pnpm --filter @workspace/capital-os run test:financial-document-upload
          pnpm --filter @workspace/capital-os run test:money-input-patterns
