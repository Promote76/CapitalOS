name: Capital OS Runtime Certification

on:
  workflow_dispatch:
    inputs:
      run_authenticated_runtime:
        description: "Run authenticated production Portfolio/Schwab certification"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: capital-os-runtime-certification
  cancel-in-progress: false

jobs:
  runtime-ref-guard:
    name: Authorize authenticated runtime ref
    if: ${{ inputs.run_authenticated_runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main for authenticated production certification
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [ "$REQUESTED_REF" != "refs/heads/main" ]; then
            echo "Authenticated runtime certification may only run from refs/heads/main."
            exit 1
          fi

  source-contracts:
    name: Source Portfolio and AI certification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Certify Portfolio AI source boundary
        run: pnpm run certify:portfolio-ai

      - name: Run broker portfolio domain tests
        run: pnpm --filter @workspace/api-server run test:broker-portfolio

  authenticated-runtime:
    name: Authenticated Portfolio and Schwab runtime certification
    if: ${{ inputs.run_authenticated_runtime && github.ref == 'refs/heads/main' }}
    needs: [source-contracts, runtime-ref-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-certification

    env:
      NODE_ENV: test
      CAPITAL_OS_PUBLISHED_ORIGIN: ${{ vars.CAPITAL_OS_PUBLISHED_ORIGIN }}
      CAPITAL_OS_PRODUCTION_OPERATOR_SESSION_COOKIE: ${{ secrets.CAPITAL_OS_PRODUCTION_OPERATOR_SESSION_COOKIE }}
      CAPITAL_OS_PRODUCTION_HOUSEHOLD_ID: ${{ secrets.CAPITAL_OS_PRODUCTION_HOUSEHOLD_ID }}
      CAPITAL_OS_SCHWAB_CLEANUP: "0"
      SCHWAB_TRADING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @workspace/api-server exec playwright install --with-deps chromium

      - name: Run authenticated read-only Portfolio/Schwab certification
        run: pnpm run certify:schwab-read-only

      - name: Upload redacted certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: schwab-portfolio-runtime-certification
          path: docs/certification/logs/SCHWAB_PORTFOLIO_SYNC_LATEST.json
          if-no-files-found: warn
          retention-days: 30
