              key: { type: string }
              label: { type: string }
              operation: { type: string, enum: [ADD, SUBTRACT] }
              amount: { type: string }
              source: { type: string }
        missingInputs: { type: array, items: { type: string } }
    VariableBudgetIntelligence:
      type: object
      required: [asOf, source, incomeProfile, documentEvidence, constraints, obligations, reserve, cash, forecast, forecastExplanation, vehicleScenarios]
      properties:
        asOf: { type: string }
        source:
          type: object
          required: [verifiedIncomeEventCount, approvedBudgetPeriod, incomeAuthority, planningStatus, forecastReadiness, pendingDocumentEvidence]
          properties:
            verifiedIncomeEventCount: { type: number }
            approvedBudgetPeriod: { type: ["string", "null"] }
            incomeAuthority: { type: string }
            planningStatus: { type: string }
            forecastReadiness: { type: string }
            pendingDocumentEvidence: { type: boolean }
        incomeProfile: { $ref: "#/components/schemas/VariableIncomeProfile" }
        documentEvidence:
          type: object
          description: Household-scoped uploaded-document evidence summary. Advisory only; never an accounting, income, balance, ledger, or money-movement authority.
          required: [documentCount, statementCount, reviewedDocumentCount, pendingDocumentCount, reviewedRowCount, pendingRowCount, reviewedDeposits, reviewedWithdrawals, excludedTransferCount, linkedSettlementDepositCount, latestStatementPeriod, latestStatementDate, readinessStatus, sourceDocumentIds, affectsOfficialTotals, explanation]
          properties:
            documentCount: { type: number }
            statementCount: { type: number }
            reviewedDocumentCount: { type: number }
            pendingDocumentCount: { type: number }
            reviewedRowCount: { type: number }
            pendingRowCount: { type: number }
            reviewedDeposits: { type: string, description: Exact decimal advisory total. }
            reviewedWithdrawals: { type: string, description: Exact decimal advisory total. }
            excludedTransferCount: { type: number }
            linkedSettlementDepositCount: { type: number }
            latestStatementPeriod:
              type: ["object", "null"]
              properties:
                start: { type: ["string", "null"] }
                end: { type: ["string", "null"] }
            latestStatementDate: { type: ["string", "null"] }
            readinessStatus: { type: string, enum: [NO_UPLOADED_EVIDENCE, PENDING_REVIEW, REVIEWED_EVIDENCE_AVAILABLE] }
            sourceDocumentIds: { type: array, items: { type: string } }
            affectsOfficialTotals: { type: boolean, enum: [false] }
            explanation: { type: string }
        constraints: { $ref: "#/components/schemas/VariableBudgetConstraintSet" }
        obligations:
          type: object
          required: [next7Days, next14Days, next30Days, next60Days, next90Days, items]
          properties:
            next7Days: { type: string }
            next14Days: { type: string }
            next30Days: { type: string }
            next60Days: { type: string }
            next90Days: { type: string }
            items:
              type: array
              items:
                type: object
                required: [name, dueDate, amount, required, source]
                properties:
                  name: { type: string }
                  dueDate: { type: string }
                  amount: { type: string }
                  required: { type: boolean }
                  source: { type: string }
        reserve:
          type: object
          required: [targetMonths, target, current, fundingGap, monthlyFunding, status]
          properties:
            targetMonths: { type: number }
            target: { type: string }
            current: { type: string }
            fundingGap: { type: string }
            monthlyFunding: { type: string }
            status: { type: string }
        cash:
          type: object
          required: [current, buffer, coverage, pressure]
          properties:
            current: { type: string }
            buffer: { type: string }
            coverage: { type: number }
            pressure: { type: string }
        forecast:
          type: array
          items: { $ref: "#/components/schemas/VariableBudgetForecast" }
        forecastExplanation: { type: string }
        vehicleScenarios:
          type: array
          items: { $ref: "#/components/schemas/VehicleScenario" }
