        "429": { description: Schwab research rate limit reached, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "502": { description: Invalid Schwab provider response, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: Schwab research provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /research/schwab/quotes/{symbol}:
    get:
      operationId: getSchwabResearchQuote
      tags: [schwab]
      summary: Read one current household-scoped Schwab quote
      parameters:
        - { name: symbol, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,15}$" } }
      responses:
        "200": { description: Normalized read-only quote research, content: { application/json: { schema: { $ref: "#/components/schemas/SchwabResearchQuoteEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Schwab research rate limit reached, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "502": { description: Invalid Schwab provider response, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: Schwab research provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /research/schwab/price-history:
    get:
      operationId: getSchwabResearchPriceHistory
      tags: [schwab]
      summary: Read bounded daily household-scoped Schwab price history
      parameters:
        - { name: symbol, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,15}$" } }
        - { name: startDate, in: query, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: endDate, in: query, required: true, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200": { description: Normalized read-only daily price history, content: { application/json: { schema: { $ref: "#/components/schemas/SchwabResearchPriceHistoryEnvelope" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: Schwab research rate limit reached, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "502": { description: Invalid Schwab provider response, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: Schwab research provider unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /research/schwab/market-snapshots:
    get:
      operationId: listMarketSnapshots
      tags: [schwab, research-dossier]
      summary: List household-scoped market snapshot drafts and approved evidence
      responses:
        "200": { description: Snapshot drafts and immutable reviewed evidence, content: { application/json: { schema: { $ref: "#/components/schemas/MarketSnapshotListResponse" } } } }
    post:
      operationId: createMarketSnapshot
      tags: [schwab, research-dossier]
      summary: Retrieve and persist a normalized Schwab market snapshot draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMarketSnapshotRequest" }
      responses:
        "201": { description: Snapshot pending human review, content: { application/json: { schema: { $ref: "#/components/schemas/MarketSnapshot" } } } }
  /research/sec/filings:
    get:
      operationId: listSecFilings
      tags: [research-dossier]
      summary: List household-scoped normalized SEC filing drafts and approved evidence
      responses:
        "200": { description: SEC filing evidence, content: { application/json: { schema: { $ref: "#/components/schemas/SecFilingListResponse" } } } }
    post:
      operationId: retrieveSecFiling
      tags: [research-dossier]
      summary: Retrieve latest 10-Q and only missing fields from latest 10-K from official SEC sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecFilingRetrievalRequest" }
      responses:
        "200": { description: Existing household-scoped immutable SEC filing and evidence returned unchanged, content: { application/json: { schema: { $ref: "#/components/schemas/SecFilingRetrievalResult" } } } }
        "201": { description: Normalized SEC draft pending human review, content: { application/json: { schema: { $ref: "#/components/schemas/SecFilingRetrievalResult" } } } }
  /research/sec/filings/{filingId}/review:
    post:
      operationId: reviewSecFiling
      tags: [research-dossier]
      summary: Approve or reject an SEC filing draft; approval emits immutable evidence
      parameters:
        - { name: filingId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecFilingReviewRequest"
      responses:
        "200": { description: Human disposition and immutable evidence, content: { application/json: { schema: { $ref: "#/components/schemas/SecFilingReviewResult" } } } }
  /research/schwab/market-snapshots/{snapshotId}/review:
    post:
      operationId: reviewMarketSnapshot
      tags: [schwab, research-dossier]
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewMarketSnapshotRequest" }
      responses:
        "200": { description: Immutable human disposition, content: { application/json: { schema: { $ref: "#/components/schemas/MarketSnapshotReviewResult" } } } }
  /research/schwab/certification:
    get:
      operationId: getSchwabResearchCertification
      tags: [schwab]
      summary: Read the latest household-scoped BKSC research certification
      responses:
        "200": { description: Latest redacted certification result, content: { application/json: { schema: { $ref: "#/components/schemas/SchwabResearchCertificationResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: runSchwabResearchCertification
      tags: [schwab]
      summary: Run exactly three read-only BKSC Schwab Market Data requests
      responses:
        "200": { description: Redacted certification result, content: { application/json: { schema: { $ref: "#/components/schemas/SchwabResearchCertification" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /integrations/schwab/disconnect:
    post:
      operationId: disconnectSchwabConnection
      tags: [schwab]
      summary: Remove household-scoped Schwab authorization material
      responses:
        "200": { description: Disconnected redacted connection state, content: { application/json: { schema: { $ref: "#/components/schemas/SchwabDisconnectResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token resolved to an active Capital OS household membership.
    clerkReverification:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk provider-supported reverification is required by the server for protected policy, approval, permission, ownership, and Micro-Live boundary writes. The client receives Clerk's reverification hint and retries after provider verification.
  parameters:
    FinancialDocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    FinancialAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    FinancialTransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    BankingConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    BillId:
      name: billId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    UpcomingExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    IncomeSourceId:
      name: incomeId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Household role or Capital Governor rejected the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested household record was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SchwabConnectResult:
      type: object
      required: [authorizationUrl, callbackUrl, readOnly, tradingEnabled]
      properties:
        authorizationUrl: { type: string }
        callbackUrl: { type: string }
        readOnly: { type: boolean, const: true }
        tradingEnabled: { type: boolean, const: false }
    SchwabRefreshResult:
      type: object
      required: [status, tokenHealth]
      properties: { status: { type: string, enum: [LIVE_CONNECTED] }, tokenHealth: { type: string, enum: [HEALTHY] } }
    SchwabSyncResult:
      type: object
      required: [status, dataMode]
      properties: { status: { type: string, enum: [SYNCED] }, dataMode: { type: string, enum: [LIVE_CONNECTED] } }
    SchwabMarketDataResult:
      type: object
      required: [provider, product, readOnly, tradingEnabled, dataMode, quotes, marketClock]
      properties:
        provider: { type: string, enum: [schwab] }
        product: { type: string, enum: [MARKET_DATA_PRODUCTION] }
        readOnly: { type: boolean, const: true }
        tradingEnabled: { type: boolean, const: false }
        dataMode: { type: string, enum: [LIVE_CONNECTED] }
        quotes:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/SchwabMarketQuote" }
        marketClock: { $ref: "#/components/schemas/SchwabMarketClock" }
    SchwabMarketDataStatus:
      type: object
      required: [provider, product, readOnly, tradingEnabled, dataMode, credentialsConfigured, callbackUrl, connectionStatus, tokenHealth, tokenExpiresAt, lastSuccessfulReadAt]
      properties:
        provider: { type: string, enum: [schwab] }
        product: { type: string, enum: [MARKET_DATA_PRODUCTION] }
        readOnly: { type: boolean, const: true }
        tradingEnabled: { type: boolean, const: false }
        dataMode: { type: string, enum: [LIVE_CONNECTED, DISCONNECTED] }
        credentialsConfigured: { type: boolean }
        callbackUrl: { type: ["string", "null"] }
        connectionStatus: { type: string, enum: [LIVE_CONNECTED, DISCONNECTED, CONFIGURATION_REQUIRED, ERROR] }
        tokenHealth: { type: string, enum: [HEALTHY, EXPIRED, UNAVAILABLE] }
        tokenExpiresAt: { type: ["string", "null"], format: date-time }
        lastSuccessfulReadAt: { type: ["string", "null"], format: date-time }
    SchwabMarketQuote:
      type: object
      required: [symbol, assetType, marketPrice, providerTimestamp, receivedAt, dataFreshness]
      properties:
        symbol: { type: string }
        assetType: { type: string }
        marketPrice: { type: string }
        providerTimestamp: { type: ["string", "null"], format: date-time }
        receivedAt: { type: string, format: date-time }
        dataFreshness: { type: string, enum: [CURRENT, AGING, STALE, UNKNOWN] }
    SchwabMarketClock:
      type: object
      required: [marketOpen, providerTimestamp, receivedAt, dataFreshness]
      properties:
        marketOpen:
          oneOf:
            - { type: boolean }
            - { type: string, enum: [UNKNOWN] }
        providerTimestamp: { type: ["string", "null"], format: date-time }
        receivedAt: { type: string, format: date-time }
        dataFreshness: { type: string, enum: [CURRENT, AGING, STALE, UNKNOWN] }
    SchwabResearchProvenance:
      type: object
      required: [sourceClass, providerEndpoint, retrievedAt, requestParameters, payloadSha256, providerRequestId]
      properties:
        sourceClass: { type: string, enum: [SCHWAB_MARKET_DATA] }
        providerEndpoint: { type: string }
        retrievedAt: { type: string, format: date-time }
        requestParameters:
          type: object
          additionalProperties:
            oneOf: [{ type: string }, { type: number }, { type: boolean }]
        payloadSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        providerRequestId: { type: ["string", "null"] }
    SchwabResearchRateLimit:
      type: object
      required: [limit, remaining, resetAt, retryAfterSeconds]
      properties:
        limit: { type: ["number", "null"] }
        remaining: { type: ["number", "null"] }
        resetAt: { type: ["string", "null"] }
        retryAfterSeconds: { type: ["number", "null"] }
    SchwabResearchEnvelopeBase:
      type: object
      required: [provider, providerProduct, capability, symbol, requestedAt, receivedAt, providerAsOf, freshness, realtime, delayed, provenance, rateLimit, readOnly, tradingEnabled, executionAuthority]
      properties:
        provider: { type: string, enum: [schwab] }
        providerProduct: { type: string, enum: [MARKET_DATA_PRODUCTION] }
        capability: { type: string, enum: [INSTRUMENT_FUNDAMENTAL, CURRENT_QUOTE, DAILY_PRICE_HISTORY] }
        symbol: { type: string }
        requestedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        providerAsOf: { type: ["string", "null"], format: date-time }
        freshness: { type: string, enum: [REALTIME, DELAYED, CURRENT, AGING, STALE, UNKNOWN] }
        realtime: { type: ["boolean", "null"] }
        delayed: { type: ["boolean", "null"] }
        provenance: { $ref: "#/components/schemas/SchwabResearchProvenance" }
        rateLimit: { $ref: "#/components/schemas/SchwabResearchRateLimit" }
        readOnly: { type: boolean, const: true }
        tradingEnabled: { type: boolean, const: false }
        executionAuthority: { type: string, const: none }
    SchwabResearchFundamental:
      type: object
      required: [asOf, marketCap, sharesOutstanding, epsTrailingTwelveMonths, peRatio, dividendAmount, dividendYield, dividendPayDate, beta, high52Week, low52Week]
      properties:
        asOf: { type: ["string", "null"], format: date-time }
        marketCap: { type: ["string", "null"] }
        sharesOutstanding: { type: ["string", "null"] }
        epsTrailingTwelveMonths: { type: ["string", "null"] }
        peRatio: { type: ["string", "null"] }
        dividendAmount: { type: ["string", "null"] }
        dividendYield: { type: ["string", "null"] }
        dividendPayDate: { type: ["string", "null"], format: date-time }
        beta: { type: ["string", "null"] }
        high52Week: { type: ["string", "null"] }
        low52Week: { type: ["string", "null"] }
    SchwabResearchInstrument:
      type: object
      required: [symbol, description, assetType, exchange, cusip, fundamental]
      properties:
        symbol: { type: string }
        description: { type: ["string", "null"] }
        assetType: { type: ["string", "null"] }
        exchange: { type: ["string", "null"] }
        cusip: { type: ["string", "null"] }
        fundamental:
          oneOf:
            - { $ref: "#/components/schemas/SchwabResearchFundamental" }
            - { type: "null" }
    SchwabResearchQuote:
      type: object
      required: [symbol, assetType, description, bidPrice, askPrice, lastPrice, markPrice, closePrice, openPrice, highPrice, lowPrice, netChange, netPercentChange, totalVolume, quoteTime, tradeTime, realtime, delayed]
      properties:
        symbol: { type: string }
        assetType: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bidPrice: { type: ["string", "null"] }
        askPrice: { type: ["string", "null"] }
        lastPrice: { type: ["string", "null"] }
        markPrice: { type: ["string", "null"] }
        closePrice: { type: ["string", "null"] }
        openPrice: { type: ["string", "null"] }
        highPrice: { type: ["string", "null"] }
        lowPrice: { type: ["string", "null"] }
        netChange: { type: ["string", "null"] }
        netPercentChange: { type: ["string", "null"] }
        totalVolume: { type: ["string", "null"] }
        quoteTime: { type: ["string", "null"], format: date-time }
        tradeTime: { type: ["string", "null"], format: date-time }
        realtime: { type: ["boolean", "null"] }
        delayed: { type: ["boolean", "null"] }
    SchwabResearchCandle:
      type: object
      required: [timestamp, open, high, low, close, volume]
      properties:
        timestamp: { type: string, format: date-time }
        open: { type: ["string", "null"] }
        high: { type: ["string", "null"] }
        low: { type: ["string", "null"] }
        close: { type: ["string", "null"] }
        volume: { type: ["string", "null"] }
    SchwabResearchPriceHistory:
      type: object
      required: [symbol, empty, previousClose, previousCloseDate, candles, requestedRange]
      properties:
        symbol: { type: string }
        empty: { type: boolean }
        previousClose: { type: ["string", "null"] }
        previousCloseDate: { type: ["string", "null"], format: date-time }
        candles: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SchwabResearchCandle" } }
        requestedRange:
          type: object
          required: [start, end, frequency, extendedHoursIncluded]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
            frequency: { type: string, enum: [DAILY] }
            extendedHoursIncluded: { type: boolean, const: false }
    SchwabResearchInstrumentEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SchwabResearchEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SchwabResearchInstrument" } } }
    SchwabResearchQuoteEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SchwabResearchEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SchwabResearchQuote" } } }
    SchwabResearchPriceHistoryEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SchwabResearchEnvelopeBase" }
        - { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SchwabResearchPriceHistory" } } }
    SchwabResearchCertificationRateLimit:
      type: object
      required: [providerRequestId, limit, remaining, resetAt, retryAfterSeconds]
      properties:
        providerRequestId: { type: ["string", "null"] }
        limit: { type: ["number", "null"] }
        remaining: { type: ["number", "null"] }
        resetAt: { type: ["string", "null"] }
        retryAfterSeconds: { type: ["number", "null"] }
    SchwabResearchCertificationCapability:
      type: object
      required: [capability, status, providerHttpStatus, providerRequestId, realtime, delayed, freshness, fieldInventory, nullFields, candlesReturned, candleDateRange, entitlementError, tokenRefreshRequired, errorCode, rateLimit]
      properties:
        capability: { type: string, enum: [INSTRUMENT_FUNDAMENTAL, CURRENT_QUOTE, DAILY_PRICE_HISTORY] }
        status: { type: string, enum: [CONFIRMED, PENDING_PROVIDER_CONFIRMATION] }
        providerHttpStatus: { type: ["number", "null"] }
        providerRequestId: { type: ["string", "null"] }
        realtime: { type: ["boolean", "null"] }
        delayed: { type: ["boolean", "null"] }
        freshness: { type: ["string", "null"] }
        fieldInventory: { type: array, items: { type: string } }
        nullFields: { type: array, items: { type: string } }
        candlesReturned: { type: ["number", "null"] }
        candleDateRange:
          oneOf:
            - type: "null"
            - type: object
              required: [start, end]
              properties:
                start: { type: string, format: date-time }
                end: { type: string, format: date-time }
        entitlementError: { type: boolean }
        tokenRefreshRequired: { type: boolean }
        errorCode: { type: ["string", "null"] }
        rateLimit: { $ref: "#/components/schemas/SchwabResearchCertificationRateLimit" }
    SchwabResearchCertification:
      type: object
      required: [id, symbol, result, requestedAt, completedAt, providerGetCount, capabilities, readOnly, tradingEnabled, executionAuthority, noTradingOrMoneyMovement, createdAt]
      properties:
        id: { type: string }
        symbol: { type: string, const: BKSC }
        result: { type: string, enum: [PASS, BLOCKED] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        providerGetCount: { type: number }
        capabilities: { type: array, items: { $ref: "#/components/schemas/SchwabResearchCertificationCapability" } }
        readOnly: { type: boolean, const: true }
        tradingEnabled: { type: boolean, const: false }
        executionAuthority: { type: string, const: none }
        noTradingOrMoneyMovement: { type: boolean, const: true }
        createdAt: { type: string, format: date-time }
    SchwabResearchCertificationResponse:
      type: object
      required: [certification]
      properties:
        certification:
          oneOf:
            - { $ref: "#/components/schemas/SchwabResearchCertification" }
            - type: "null"
    SchwabDisconnectResult:
      type: object
      required: [status, readOnly, tradingEnabled]
      properties: { status: { type: string, enum: [DISCONNECTED] }, readOnly: { type: boolean, const: true }, tradingEnabled: { type: boolean, const: false } }
    SchwabStatus:
      type: object
      required: [provider, readOnly, tradingEnabled, dataMode, credentialsConfigured, callbackUrl, connectionStatus, accountAuthorizationStatus, tokenHealth, tokenExpiresAt, lastSuccessfulSyncAt]
      properties:
        provider: { type: string, enum: [schwab] }
        readOnly: { type: boolean, const: true }
        tradingEnabled: { type: boolean, const: false }
        dataMode: { type: string, enum: [LIVE_CONNECTED, DISCONNECTED] }
        credentialsConfigured: { type: boolean }
        callbackUrl: { type: ["string", "null"] }
        connectionStatus: { type: string, enum: [LIVE_CONNECTED, DISCONNECTED, CONFIGURATION_REQUIRED, ERROR] }
        accountAuthorizationStatus: { type: string, enum: [AUTHORIZED, NOT_AUTHORIZED] }
        tokenHealth: { type: string, enum: [HEALTHY, EXPIRED, UNAVAILABLE] }
        tokenExpiresAt: { type: ["string", "null"], format: date-time }
        lastSuccessfulSyncAt: { type: ["string", "null"], format: date-time }
    FinancialDocument:
      type: object
      required: [id, documentType, status, sourceFileName, mimeType, documentHash, sourceObjectPath, uploadedAt, detectionSignals, businessId]
      properties:
        id: { type: string }
        businessId: { type: [string, "null"] }
        documentType: { type: string }
        originalDocumentType: { type: [string, "null"] }
        detectedDocumentType: { type: [string, "null"] }
        detectionConfidence: { type: [string, "null"] }
        detectionSignals: { type: array, items: { type: string } }
        detectionVersion: { type: [string, "null"] }
        typeMismatchStatus: { type: string }
        canonicalDocumentId: { type: [string, "null"] }
        duplicateOfDocumentId: { type: [string, "null"] }
        supersedesDocumentId: { type: [string, "null"] }
        supersededByDocumentId: { type: [string, "null"] }
        versionLabel: { type: [string, "null"] }
        identityStatus: { type: string }
        status: { type: string }
        sourceInstitution: { type: [string, "null"] }
        sourceFileName: { type: string }
        mimeType: { type: string }
        documentHash: { type: string }
        sourceObjectPath: { type: string }
        sourceMetadata: { type: object, additionalProperties: true }
        periodStart: { type: [string, "null"] }
        periodEnd: { type: [string, "null"] }
        statementDate: { type: [string, "null"] }
        parserVersion: { type: [string, "null"] }
        sourceRecordType: { type: [string, "null"] }
