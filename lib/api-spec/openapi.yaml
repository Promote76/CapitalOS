components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk-issued session token resolved to an active Capital OS household membership.
    clerkReverification:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk provider-supported reverification is required by the server for protected policy, approval, permission, ownership, and Micro-Live boundary writes. The client receives Clerk's reverification hint and retries after provider verification.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    FinancialAccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    FinancialTransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    BankingConnectionId:
      name: connectionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    BillId:
      name: billId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    UpcomingExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    IncomeSourceId:
      name: incomeId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Household role or Capital Governor rejected the action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested household record was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    OnboardHouseholdInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        timezone: { type: string, default: America/Chicago }
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string, nullable: true }
        details:
          type: ["object", "null"]
          additionalProperties: true
    HouseholdSummary:
      type: object
      required: [id, name, timezone, role, permissions, privacy]
      properties:
        id: { type: string }
        name: { type: string }
        timezone: { type: string }
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
        privacy:
          type: object
          required: [financeDataPrivate, shareHealthSummary, credentialsStored, bankActionsEnabled]
          properties:
            financeDataPrivate: { type: boolean }
            shareHealthSummary: { type: boolean }
            credentialsStored: { type: boolean }
            bankActionsEnabled: { type: boolean }
    PrivacySettingsInput:
      type: object
      required: [financeDataPrivate, shareHealthSummary]
      properties:
        financeDataPrivate: { type: boolean }
        shareHealthSummary: { type: boolean }
    AccountSummary:
      type: object
      required: [id, name, accountType, balance, protected, riskClass]
      properties:
        id: { type: string }
        name: { type: string }
        accountType: { type: string }
        balance: { type: string }
        protected: { type: boolean }
        riskClass: { type: string }
    GoalSummary:
      type: object
      required: [id, name, targetAmount, currentAmount, protectedAmount, weeklyContribution, progressPercent, amountRemaining, weeksRemaining, requiredWeeklyContribution, projectedCompletionWeeks, status, priority, targetDate]
      properties:
        id: { type: string }
        name: { type: string }
        targetAmount: { type: string }
        currentAmount: { type: string }
        protectedAmount: { type: string }
        weeklyContribution: { type: string }
        progressPercent: { type: number }
        amountRemaining: { type: string }
        weeksRemaining: { type: number }
        requiredWeeklyContribution: { type: string }
        projectedCompletionWeeks:
          type: ["number", "null"]
        status: { type: string }
        priority: { type: string }
        targetDate: { type: string, format: date }
    AllocationSummary:
      type: object
      required: [totalWeekly, duplexReserve, capitalOs, opportunityReserve]
      properties:
        totalWeekly: { type: string }
        duplexReserve: { type: string }
        capitalOs: { type: string }
        opportunityReserve: { type: string }
    ContributionSummary:
      type: object
      required: [id, amount, status, createdAt, metadata]
      properties:
        id: { type: string }
        amount: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        idempotencyKey: { type: string }
        metadata:
          type: object
          additionalProperties: true
    ContributionInput:
      type: object
      required: [amount]
      properties:
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        goalId: { type: ["string", "null"] }
        note: { type: ["string", "null"], maxLength: 500 }
    TransferInput:
      type: object
      required: [sourceAccountId, destinationAccountId, amount]
      properties:
        sourceAccountId: { type: string }
        destinationAccountId: { type: string }
        amount: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        note: { type: ["string", "null"], maxLength: 500 }
    AllocationInput:
      type: object
      required: [totalWeekly, duplexReserve, capitalOs, opportunityReserve]
      properties:
        totalWeekly: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        duplexReserve: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        capitalOs: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
        opportunityReserve: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,2})?$" }
    AllocationImpact:
      type: object
      required: [current, proposed, totalMatches, duplexWeeklyChange, projectedDelayWeeks, protectedSavingsChange, activeCapitalChange, propertyReadinessImpact]
      properties:
        current: { $ref: "#/components/schemas/AllocationSummary" }
        proposed: { $ref: "#/components/schemas/AllocationSummary" }
        totalMatches: { type: boolean }
        duplexWeeklyChange: { type: string }
        projectedDelayWeeks: { type: number }
        protectedSavingsChange: { type: string }
        activeCapitalChange: { type: string }
        propertyReadinessImpact: { type: string }
    ReportDescriptor:
      type: object
      required: [kind, title, status, private, hashable]
      properties:
        kind: { type: string }
        title: { type: string }
        status: { type: string }
        private: { type: boolean }
        hashable: { type: boolean }
    TransactionSummary:
      type: object
      required: [id, amount, category, status, createdAt]
      properties:
        id: { type: string }
        amount: { type: string }
        category: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    PortfolioSummary:
      type: object
      required: [totalCapital, protectedCapital, activeCapital, cashReserve, ledgerBalanced, composition]
      properties:
        totalCapital: { type: string }
        protectedCapital: { type: string }
        activeCapital: { type: string }
        cashReserve: { type: string }
        ledgerBalanced: { type: boolean }
        composition:
          type: array
          items:
            type: object
            required: [label, amount, percent]
            properties:
              label: { type: string }
              amount: { type: string }
              percent: { type: number }
    PropertyMilestone:
      type: object
      required: [id, name, status, progress, target, currentState, nextAction]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        progress: { type: number }
        target: { type: string }
        currentState: { type: string }
        nextAction: { type: string }
        dueDate: { type: ["string", "null"], format: date }
    BuyBox:
      type: object
      required: [id, householdId, propertyType, ownerOccupied, purchasePriceMinimum, purchasePriceMaximum, targetCashToClose, minimumBedroomsPerUnit, minimumBathroomsPerUnit, minimumEstimatedRent, maximumEstimatedRehabilitation, minimumCashFlow, maximumMonthlyHousingCost, minimumDscrEstimate, minimumPropertyCondition, targetMarkets, excludedMarkets, minimumReadinessScore]
      properties:
        id: { type: string }
        householdId: { type: string }
        propertyType: { type: string }
        ownerOccupied: { type: boolean }
        purchasePriceMinimum: { type: string }
        purchasePriceMaximum: { type: string }
        targetCashToClose: { type: string }
        minimumBedroomsPerUnit: { type: string }
        minimumBathroomsPerUnit: { type: string }
        minimumEstimatedRent: { type: string }
        maximumEstimatedRehabilitation: { type: string }
        minimumCashFlow: { type: string }
        maximumMonthlyHousingCost: { type: string }
        minimumDscrEstimate: { type: string }
        minimumPropertyCondition: { type: string }
        targetMarkets: { type: array, items: { type: string } }
        excludedMarkets: { type: array, items: { type: string } }
        minimumReadinessScore: { type: string }
    UpdateBuyBoxInput:
      type: object
      properties:
        propertyType: { type: string }
        ownerOccupied: { type: boolean }
        purchasePriceMinimum: { type: string }
        purchasePriceMaximum: { type: string }
        targetCashToClose: { type: string }
        minimumBedroomsPerUnit: { type: string }
        minimumBathroomsPerUnit: { type: string }
        minimumEstimatedRent: { type: string }
        maximumEstimatedRehabilitation: { type: string }
        minimumCashFlow: { type: string }
        maximumMonthlyHousingCost: { type: string }
        minimumDscrEstimate: { type: string }
        minimumPropertyCondition: { type: string }
        targetMarkets: { type: array, items: { type: string } }
        excludedMarkets: { type: array, items: { type: string } }
        minimumReadinessScore: { type: string }
    CreatePropertyCandidateInput:
      type: object
      required: [propertyGoalId, addressLabel, propertyType, units, bedrooms, askingPrice, estimatedRent, repairs, market]
      properties:
        propertyGoalId: { type: string }
        addressLabel: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
