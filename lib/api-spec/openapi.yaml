openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Capital OS household capital operating system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: household
  - name: capital
  - name: planning
  - name: governance
  - name: blockchain
  - name: household-finance
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /household:
    get:
      operationId: getHousehold
      tags: [household]
      summary: Get the current household
      responses:
        "200":
          description: Household workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSummary"
  /household/privacy:
    patch:
      operationId: updatePrivacySettings
      tags: [household]
      summary: Update household finance privacy controls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacySettingsInput" }
      responses:
        "200":
          description: Updated household workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdSummary" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [capital]
      summary: Get the household dashboard snapshot
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
  /accounts:
    get:
      operationId: listAccounts
      tags: [capital]
      summary: List internal capital accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
  /goals:
    get:
      operationId: listGoals
      tags: [capital]
      summary: List capital goals
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalSummary"
  /contributions:
    get:
      operationId: listContributions
      tags: [capital]
      summary: List household contributions
      responses:
        "200":
          description: Contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContributionSummary"
    post:
      operationId: createContribution
      tags: [capital]
      summary: Record a household contribution
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionInput"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /transfers:
    post:
      operationId: createTransfer
      tags: [capital]
      summary: Create an internal transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /allocations/impact:
    post:
      operationId: previewAllocationImpact
      tags: [capital]
      summary: Preview an allocation rule change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationInput"
      responses:
        "200":
          description: Allocation impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationImpact"
        "400":
          $ref: "#/components/responses/BadRequest"
  /allocations:
    put:
      operationId: updateAllocation
      tags: [capital]
      summary: Save an allocation rule after previewing its impact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationInput"
      responses:
        "200":
          description: Saved allocation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portfolio:
    get:
      operationId: getPortfolio
      tags: [capital]
      summary: Get portfolio composition and ledger health
      responses:
        "200":
          description: Portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
  /properties:
    get:
      operationId: getProperties
      tags: [planning]
      summary: Get property planning data
      responses:
        "200":
          description: Property planning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummary"
    post:
      operationId: addPropertyNote
      tags: [planning]
      summary: Add a private property research note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyNoteInput"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyNote"
        "403":
          $ref: "#/components/responses/Forbidden"
  /properties/underwriting:
    get:
      operationId: getPropertyUnderwriting
      tags: [planning]
      summary: Get the acquisition dashboard and underwriting data
      responses:
        "200":
          description: Property underwriting dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyUnderwriting" }
  /properties/buy-box:
    patch:
      operationId: updateBuyBox
      tags: [planning]
      summary: Update the household duplex buy box
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBuyBoxInput" }
      responses:
        "200":
          description: Updated buy box
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyBox" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /properties/candidates:
    post:
      operationId: createPropertyCandidate
      tags: [planning]
      summary: Add a property candidate to the acquisition pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePropertyCandidateInput" }
      responses:
        "201":
          description: Property candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyCandidate" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /properties/candidates/{candidateId}/analyze:
    post:
      operationId: analyzePropertyCandidate
      tags: [planning]
      summary: Calculate a property candidate underwriting package
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Underwriting analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyAnalysis" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /strategies:
    get:
      operationId: listStrategies
      tags: [planning]
      summary: List strategy lifecycle records
      responses:
        "200":
          description: Strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategySummary"
  /strategy-lab:
    get:
      operationId: getStrategyLab
      tags: [planning]
      summary: Get the research-only Strategy Lab snapshot
      responses:
        "200":
          description: Strategy Lab snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyLabSnapshot"
  /strategy-lab/strategies:
    post:
      operationId: createResearchStrategy
      tags: [planning]
      summary: Create an unproven research strategy with a required hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchStrategyInput"
      responses:
        "201":
          description: Research strategy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchStrategyCreated"
  /strategy-lab/strategies/{strategyId}/versions:
    post:
      operationId: createStrategyVersion
      tags: [planning]
      summary: Create an immutable strategy version
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyVersionInput"
      responses:
        "201":
          description: Immutable strategy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionCreated"
  /strategy-lab/experiments:
    post:
      operationId: runStrategyExperiment
      tags: [planning]
      summary: Run a deterministic simulated Strategy Lab experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStrategyExperimentInput"
      responses:
        "201":
          description: Simulated experiment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyLabExperiment"
  /strategy-lab/strategies/{strategyId}/graduation:
    post:
      operationId: evaluateStrategyGraduation
      tags: [planning]
      summary: Evaluate strategy evidence gates without enabling live trading
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "200":
          description: Graduation eligibility review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyGraduationReview"
  /strategy-lab/journal:
    post:
      operationId: createResearchJournalEntry
      tags: [planning]
      summary: Add a Strategy Lab research journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchJournalEntryInput"
      responses:
        "201":
          description: Research journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJournalEntry"
  /strategies/{strategyId}/promote:
    post:
      operationId: promoteStrategy
      tags: [planning]
      summary: Promote a strategy by one validated stage
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyPromotionInput"
      responses:
        "200":
          description: Promoted strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /strategies/{strategyId}/allocation:
    post:
      operationId: allocateStrategy
      tags: [planning]
      summary: Allocate internal capital to an approved strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyAllocationInput"
      responses:
        "201":
          description: Strategy allocation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /risk:
    get:
      operationId: getRisk
      tags: [governance]
      summary: Get Capital Governor state and safeguards
      responses:
        "200":
          description: Risk state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSummary"
  /risk/emergency-stop:
    post:
      operationId: activateEmergencyStop
      tags: [governance]
      summary: Activate the human-confirmed emergency stop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyStopInput"
      responses:
        "200":
          description: Risk state after activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recommendations:
    get:
      operationId: listRecommendations
      tags: [governance]
      summary: List AI CIO advisory recommendations
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecommendationSummary"
  /recommendations/{recommendationId}/decision:
    post:
      operationId: decideRecommendation
      tags: [governance]
      summary: Record a human recommendation decision
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationDecisionInput"
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
  /intelligence:
    get:
      operationId: getIntelligence
      tags: [governance]
      summary: Get the explainable household intelligence snapshot
      responses:
        "200":
          description: Intelligence snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSnapshot"
  /intelligence/refresh:
    post:
      operationId: refreshIntelligence
      tags: [governance]
      summary: Refresh persisted advisory intelligence
      responses:
        "200":
          description: Refreshed intelligence snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelligenceSnapshot"
  /intelligence/scenario:
    post:
      operationId: runIntelligenceScenario
      tags: [governance]
      summary: Run a non-mutating contribution pace scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceScenarioInput"
      responses:
        "200":
          description: Contribution scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionScenario"
  /intelligence/feedback:
    post:
      operationId: recordIntelligenceFeedback
      tags: [governance]
      summary: Record human feedback on an advisory recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelligenceFeedbackInput"
      responses:
        "201":
          description: Recorded recommendation feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationFeedback"
  /audit:
    get:
      operationId: listAuditEvents
      tags: [governance]
      summary: List append-only audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEventSummary"
  /reports:
    get:
      operationId: listReports
      tags: [governance]
      summary: List private report interfaces
      responses:
        "200":
          description: Available report interfaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDescriptor"
  /blockchain/status:
    get:
      operationId: getBlockchainStatus
      tags: [blockchain]
      summary: Get disabled-by-default chain adapter status
      responses:
        "200":
          description: Blockchain status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockchainStatus"
  /budget:
    get:
      operationId: getBudget
      tags: [household-finance]
      summary: Get current household budget performance
      responses:
        "200":
          description: Budget performance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetSummary" }
  /cash-flow:
    get:
      operationId: getCashFlow
      tags: [household-finance]
      summary: Get household cash flow and financial health
      responses:
        "200":
          description: Cash flow snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashFlowSummary" }
  /financial-accounts:
    get:
      operationId: listFinancialAccounts
      tags: [household-finance]
      summary: List read-only household financial accounts
      responses:
        "200":
          description: Financial accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialAccountsSummary" }
    post:
      operationId: createManualFinancialAccount
      tags: [household-finance]
      summary: Add a manual financial account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualFinancialAccountInput" }
      responses:
        "201":
          description: Financial account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialAccount" }
  /financial-accounts/{accountId}/import-csv:
    post:
      operationId: importFinancialAccountCsv
      tags: [household-finance]
      summary: Import read-only transactions from CSV
      parameters:
        - $ref: "#/components/parameters/FinancialAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CsvImportInput" }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [imported, skippedDuplicates, readOnly]
                properties:
                  imported: { type: number }
                  skippedDuplicates: { type: number }
                  readOnly: { type: boolean }
  /bills:
    get:
      operationId: listBills
      tags: [household-finance]
      summary: List upcoming household bills
      responses:
        "200":
          description: Bills
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bill" }
    post:
      operationId: createBill
      tags: [household-finance]
      summary: Add a household bill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillInput" }
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
  /bills/{billId}:
    patch:
      operationId: updateBill
      tags: [household-finance]
      summary: Update a household bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillUpdateInput" }
      responses:
        "200":
          description: Bill updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
    delete:
      operationId: deleteBill
      tags: [household-finance]
      summary: Delete a household bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "204":
          description: Bill deleted
  /bills/{billId}/pause:
    post:
      operationId: pauseBill
      tags: [household-finance]
      summary: Pause a household bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
  /bills/{billId}/resume:
    post:
      operationId: resumeBill
      tags: [household-finance]
      summary: Resume a household bill
      parameters:
        - $ref: "#/components/parameters/BillId"
      responses:
        "200":
          description: Bill resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
  /upcoming-expenses:
    get:
      operationId: listUpcomingExpenses
      tags: [household-finance]
      summary: List known upcoming expenses
      responses:
        "200":
          description: Upcoming expenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UpcomingExpense" }
    post:
      operationId: createUpcomingExpense
      tags: [household-finance]
      summary: Add a known upcoming expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpcomingExpenseInput" }
      responses:
        "201":
          description: Upcoming expense created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingExpense" }
  /upcoming-expenses/{expenseId}:
    patch:
      operationId: updateUpcomingExpense
      tags: [household-finance]
      summary: Update a known upcoming expense
      parameters:
        - $ref: "#/components/parameters/UpcomingExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpcomingExpenseUpdateInput" }
      responses:
        "200":
          description: Upcoming expense updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingExpense" }
    delete:
      operationId: deleteUpcomingExpense
      tags: [household-finance]
      summary: Delete a known upcoming expense
      parameters:
        - $ref: "#/components/parameters/UpcomingExpenseId"
      responses:
        "204":
          description: Upcoming expense deleted
  /upcoming-expenses/{expenseId}/pause:
    post:
      operationId: pauseUpcomingExpense
      tags: [household-finance]
      summary: Pause a known upcoming expense
      parameters:
        - $ref: "#/components/parameters/UpcomingExpenseId"
      responses:
        "200":
          description: Upcoming expense paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingExpense" }
  /upcoming-expenses/{expenseId}/resume:
    post:
      operationId: resumeUpcomingExpense
      tags: [household-finance]
      summary: Resume a known upcoming expense
      parameters:
        - $ref: "#/components/parameters/UpcomingExpenseId"
      responses:
        "200":
          description: Upcoming expense resumed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingExpense" }
  /income:
    get:
      operationId: listIncomeSources
      tags: [household-finance]
      summary: List household income sources
      responses:
        "200":
          description: Income sources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncomeSource" }
    post:
      operationId: createIncomeSource
      tags: [household-finance]
      summary: Add a household income source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomeSourceInput" }
      responses:
        "201":
          description: Income source created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeSource" }
  /income/{incomeId}:
    patch:
      operationId: updateIncomeSource
      tags: [household-finance]
      summary: Update a household income source
      parameters:
        - $ref: "#/components/parameters/IncomeSourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncomeSourceUpdateInput" }
      responses:
        "200":
          description: Income source updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeSource" }
    delete:
      operationId: deleteIncomeSource
      tags: [household-finance]
      summary: Delete a household income source
      parameters:
        - $ref: "#/components/parameters/IncomeSourceId"
      responses:
        "204":
          description: Income source deleted
  /income/{incomeId}/pause:
    post:
      operationId: pauseIncomeSource
      tags: [household-finance]
      summary: Pause a household income source
      parameters:
        - $ref: "#/components/parameters/IncomeSourceId"
      responses:
        "200":
          description: Income source paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeSource" }
  /income/{incomeId}/resume:
    post:
      operationId: resumeIncomeSource
      tags: [household-finance]
      summary: Resume a household income source
      parameters:
        - $ref: "#/components/parameters/IncomeSourceId"
