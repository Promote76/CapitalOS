openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: Capital OS household capital operating system API
servers:
  - url: /api
    description: Base API path
security:
  - clerkSession: []
tags:
  - name: health
  - name: auth
  - name: household
  - name: capital
  - name: planning
  - name: governance
  - name: blockchain
  - name: household-finance
  - name: treasury
  - name: accounting
  - name: operations
  - name: business
  - name: financing
paths:
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/live:
    get:
      security: []
      operationId: healthLive
      tags: [health]
      summary: Dependency-free liveness check
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /health/ready:
    get:
      security: []
      operationId: healthReady
      tags: [health]
      summary: PostgreSQL readiness check
      responses:
        "200":
          description: Dependencies are ready
        "503":
          description: A dependency is unavailable
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Resolve the authenticated Clerk user and household memberships
      responses:
        "200":
          description: Internal identity and memberships
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/onboard:
    post:
      operationId: onboardHousehold
      tags: [auth]
      summary: Create the first household for an authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardHouseholdInput" }
      responses:
        "201":
          description: Household created with conservative defaults
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: User already belongs to an active household
  /household:
    get:
      operationId: getHousehold
      tags: [household]
      summary: Get the current household
      responses:
        "200":
          description: Household workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSummary"
  /household/privacy:
    patch:
      operationId: updatePrivacySettings
      tags: [household]
      summary: Update household finance privacy controls
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacySettingsInput" }
      responses:
        "200":
          description: Updated household workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HouseholdSummary" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [capital]
      summary: Get the household dashboard snapshot
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
  /accounts:
    get:
      operationId: listAccounts
      tags: [capital]
      summary: List internal capital accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
  /goals:
    get:
      operationId: listGoals
      tags: [capital]
      summary: List capital goals
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoalSummary"
  /contributions:
    get:
      operationId: listContributions
      tags: [capital]
      summary: List household contributions
      responses:
        "200":
          description: Contributions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContributionSummary"
    post:
      operationId: createContribution
      tags: [capital]
      summary: Record a household contribution
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionInput"
      responses:
        "201":
          description: Contribution recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /transfers:
    post:
      operationId: createTransfer
      tags: [capital]
      summary: Create an internal transfer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /allocations/impact:
    post:
      operationId: previewAllocationImpact
      tags: [capital]
      summary: Preview an allocation rule change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationInput"
      responses:
        "200":
          description: Allocation impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationImpact"
        "400":
          $ref: "#/components/responses/BadRequest"
  /allocations:
    put:
      operationId: updateAllocation
      tags: [capital]
      summary: Save an allocation rule after previewing its impact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllocationInput"
      responses:
        "200":
          description: Saved allocation rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllocationSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /portfolio:
    get:
      operationId: getPortfolio
      tags: [capital]
      summary: Get portfolio composition and ledger health
      responses:
        "200":
          description: Portfolio snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
  /properties:
    get:
      operationId: getProperties
      tags: [planning]
      summary: Get property planning data
      responses:
        "200":
          description: Property planning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySummary"
    post:
      operationId: addPropertyNote
      tags: [planning]
      summary: Add a private property research note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyNoteInput"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyNote"
        "403":
          $ref: "#/components/responses/Forbidden"
  /properties/underwriting:
    get:
      operationId: getPropertyUnderwriting
      tags: [planning]
      summary: Get the acquisition dashboard and underwriting data
      responses:
        "200":
          description: Property underwriting dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyUnderwriting" }
  /properties/buy-box:
    patch:
      operationId: updateBuyBox
      tags: [planning]
      summary: Update the household duplex buy box
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBuyBoxInput" }
      responses:
        "200":
          description: Updated buy box
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyBox" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /properties/candidates:
    post:
      operationId: createPropertyCandidate
      tags: [planning]
      summary: Add a property candidate to the acquisition pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePropertyCandidateInput" }
      responses:
        "201":
          description: Property candidate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyCandidate" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /properties/candidates/{candidateId}/analyze:
    post:
      operationId: analyzePropertyCandidate
      tags: [planning]
      summary: Calculate a property candidate underwriting package
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Underwriting analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyAnalysis" }
        "403":
          $ref: "#/components/responses/Forbidden"
  /strategies:
    get:
      operationId: listStrategies
      tags: [planning]
      summary: List strategy lifecycle records
      responses:
        "200":
          description: Strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StrategySummary"
  /strategy-lab:
    get:
      operationId: getStrategyLab
      tags: [planning]
      summary: Get the research-only Strategy Lab snapshot
      responses:
        "200":
          description: Strategy Lab snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyLabSnapshot"
  /micro-live:
    get:
      operationId: getMicroLive
      tags: [planning]
      summary: Get the fail-closed Micro-Live execution monitor
      responses:
        "200":
          description: Micro-Live control-plane snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveSnapshot" }
  /execution-control:
    get:
      operationId: getExecutionControl
      tags: [planning]
      summary: Get the household-scoped server execution control state
      responses:
        "200":
          description: Execution control state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionControlState" }
  /execution-control/stop:
    post:
      operationId: requestExecutionStop
      tags: [planning]
      summary: Request an authoritative execution stop
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionControlCommandInput" }
      responses:
        "200":
          description: Confirmed execution state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionControlState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /execution-control/safe-mode:
    post:
      operationId: requestExecutionSafeMode
      tags: [planning]
      summary: Request an authoritative safe mode transition
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionControlCommandInput" }
      responses:
        "200":
          description: Confirmed execution state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionControlState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /execution-control/evacuate:
    post:
      operationId: requestExecutionEvacuate
      tags: [planning]
      summary: Request an authoritative evacuation state
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionControlCommandInput" }
      responses:
        "200":
          description: Confirmed execution state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionControlState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /execution-control/recover:
    post:
      operationId: recoverExecutionControl
      tags: [planning]
      summary: Recover a stopped or locked execution control to disabled
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionControlCommandInput" }
      responses:
        "200":
          description: Confirmed disabled execution state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionControlState" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /micro-live/rehearsal:
    post:
      operationId: runMicroLiveRehearsal
      tags: [planning]
      summary: Run a no-transmission Micro-Live rehearsal
      responses:
        "201":
          description: Rehearsal result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveRehearsal" }
  /micro-live/enablement-review:
    post:
      operationId: reviewMicroLiveEnablement
      tags: [planning]
      summary: Review Micro-Live gates without enabling execution
      responses:
        "200":
          description: Enablement review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveEnablementReview" }
  /micro-live/venues/{venueId}/approve:
    post:
      operationId: approveMicroLiveVenue
      tags: [planning]
      summary: Record an owner-controlled real venue approval review
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicroLiveVenueApprovalRequest" }
      responses:
        "200":
          description: Venue approval record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveVenueApproval" }
  /micro-live/venues/{venueId}/reviews/{kind}:
    post:
      operationId: recordMicroLiveVenueReview
      tags: [planning]
      summary: Record an independent venue security or jurisdiction review
      parameters:
        - name: venueId
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [security, jurisdiction] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicroLiveVenueReviewRequest" }
      responses:
        "201":
          description: Independent review record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveVenueReview" }
  /micro-live/arm:
    post:
      operationId: armMicroLive
      tags: [planning]
      summary: Arm a Micro-Live session through the human-controlled boundary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicroLiveArmRequest"
      responses:
        "200":
          description: Armed session or fail-closed rejection
          content:
            application/json:
              schema:
                type: object
                required: [status, sessionId, authorizationExpiresAt, liveExecutionEnabled]
                properties:
                  status: { type: string }
                  sessionId: { type: string }
                  authorizationExpiresAt: { type: string, format: date-time }
                  liveExecutionEnabled: { type: boolean }
  /micro-live/orders:
    post:
      operationId: submitMicroLiveOrder
      tags: [planning]
      summary: Submit one authenticated Micro-Live order through the durable OMS
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicroLiveOrderRequest" }
      responses:
        "201":
          description: Durable order intent, provider acknowledgement, and reconciliation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveOrderResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /micro-live/orders/{orderIntentId}/cancel:
    post:
      operationId: cancelMicroLiveOrder
      tags: [planning]
      summary: Cancel one provider order through the durable OMS
      parameters:
        - name: orderIntentId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
      responses:
        "200":
          description: Durable cancellation acknowledgement and reconciliation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveOrderResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /micro-live/first-fill/approve:
    post:
      operationId: approveMicroLiveFirstFillResume
      tags: [planning]
      summary: Approve resuming new orders after clean first-fill reconciliation
      responses:
        "200":
          description: First-fill hold approval
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, approvedAt, approvedBy, allowNewOrders, liveExecutionEnabled]
                properties:
                  sessionId: { type: string }
                  approvedAt: { type: string, format: date-time }
                  approvedBy: { type: string }
                  allowNewOrders: { type: boolean }
                  liveExecutionEnabled: { type: boolean }
  /micro-live/reconciliation-runs:
    get:
      operationId: listMicroLiveReconciliationRuns
      tags: [planning]
      summary: List persisted Micro-Live reconciliation runs
      responses:
        "200":
          description: Reconciliation history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicroLiveReconciliationRun" }
    post:
      operationId: runMicroLiveReconciliation
      tags: [planning]
      summary: Persist a venue-authoritative Micro-Live reconciliation run
      responses:
        "201":
          description: Reconciliation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveReconciliationRun" }
  /micro-live/position-snapshots:
    get:
      operationId: listMicroLivePositionSnapshots
      tags: [planning]
      summary: List persisted Micro-Live position snapshots
      responses:
        "200":
          description: Position snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicroLivePositionSnapshot" }
  /micro-live/fill-snapshots:
    get:
      operationId: listMicroLiveFillSnapshots
      tags: [planning]
      summary: List persisted Micro-Live fill snapshots
      responses:
        "200":
          description: Fill snapshots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicroLiveFillSnapshot" }
  /micro-live/incidents:
    get:
      operationId: listMicroLiveIncidents
      tags: [planning]
      summary: List open Micro-Live incidents
      responses:
        "200":
          description: Open incidents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicroLiveIncident" }
  /micro-live/incidents/{incidentId}/reviews:
    post:
      operationId: createMicroLiveIncidentReview
      tags: [planning]
      summary: Record a human post-incident review
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicroLiveIncidentReviewInput" }
      responses:
        "201":
          description: Post-incident review and reactivation requirements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveIncidentReview" }
  /micro-live/incident-reviews:
    get:
      operationId: listMicroLiveIncidentReviews
      tags: [planning]
      summary: List persisted human post-incident reviews
      responses:
        "200":
          description: Post-incident reviews
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicroLiveIncidentReview" }
  /micro-live/reactivation-requirements:
    get:
      operationId: listMicroLiveReactivationRequirements
      tags: [planning]
      summary: List human reactivation requirements
      responses:
        "200":
          description: Reactivation requirements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MicroLiveReactivationRequirement" }
  /micro-live/reactivation-requirements/{requirementId}/complete:
    post:
      operationId: completeMicroLiveReactivationRequirement
      tags: [planning]
      summary: Complete a human reactivation requirement
      parameters:
        - name: requirementId
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
      responses:
        "200":
          description: Updated reactivation requirement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MicroLiveReactivationRequirement" }
  /strategy-lab/strategies:
    post:
      operationId: createResearchStrategy
      tags: [planning]
      summary: Create an unproven research strategy with a required hypothesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchStrategyInput"
      responses:
        "201":
          description: Research strategy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchStrategyCreated"
  /strategy-lab/strategies/{strategyId}/versions:
    post:
      operationId: createStrategyVersion
      tags: [planning]
      summary: Create an immutable strategy version
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyVersionInput"
      responses:
        "201":
          description: Immutable strategy version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyVersionCreated"
  /strategy-lab/experiments:
    post:
      operationId: runStrategyExperiment
      tags: [planning]
      summary: Run a deterministic simulated Strategy Lab experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStrategyExperimentInput"
      responses:
        "201":
          description: Simulated experiment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyLabExperiment"
  /strategy-lab/strategies/{strategyId}/graduation:
    post:
      operationId: evaluateStrategyGraduation
      tags: [planning]
      summary: Evaluate strategy evidence gates without enabling live trading
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "200":
          description: Graduation eligibility review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategyGraduationReview"
  /strategy-lab/journal:
    post:
      operationId: createResearchJournalEntry
      tags: [planning]
      summary: Add a Strategy Lab research journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResearchJournalEntryInput"
      responses:
        "201":
          description: Research journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchJournalEntry"
  /strategies/{strategyId}/promote:
    post:
      operationId: promoteStrategy
      tags: [planning]
      summary: Promote a strategy by one validated stage
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyPromotionInput"
      responses:
        "200":
          description: Promoted strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrategySummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /strategies/{strategyId}/allocation:
    post:
      operationId: allocateStrategy
      tags: [planning]
      summary: Allocate internal capital to an approved strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrategyAllocationInput"
      responses:
        "201":
          description: Strategy allocation recorded
          content:
            application/json:
              schema:
